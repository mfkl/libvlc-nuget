# Loaded in place of VLC 3.0.23's Apple build.conf. Keep the original defaults
# for platform setup and explicitly select the dependencies we distribute.
source "$(dirname "${BASH_SOURCE[0]}")/build.conf.upstream"
export VLC_DEPLOYMENT_TARGET_MACOSX="11.0"
export VLC_CONTRIB_OPTIONS_BASE=(
    # FreeType's FTL alternative requires its attribution clause to be enabled.
    --disable-gpl --enable-ad-clauses --disable-all
    --enable-ffmpeg --enable-dav1d --enable-vpx
    --enable-ogg --enable-vorbis --enable-flac --enable-opus
    --enable-matroska
    --enable-freetype2 --enable-fribidi --enable-harfbuzz --enable-ass
    --enable-libxml2 --enable-soxr --enable-dvbpsi --enable-live555
    --enable-gnutls --enable-zlib --enable-jpeg --enable-png
)
export VLC_CONTRIB_OPTIONS_MACOSX=()
VLC_CONFIG_OPTIONS_BASE+=(
    --disable-static --disable-faad --disable-twolame --disable-dca
    --disable-x264 --disable-x265 --disable-postproc --disable-smbclient
    --disable-chromaprint --disable-caca
    --enable-avcodec --enable-avformat --enable-swscale --enable-mkv
    --enable-freetype --enable-libass --enable-gnutls --enable-live555
)
# Leave architecture selection to the upstream script. It enables the macOS
# audio/video outputs independently of the disabled VLC application interface.
