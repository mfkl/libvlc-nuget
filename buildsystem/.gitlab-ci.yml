variables:
    VLC_UWP_LLVM_IMAGE: registry.videolan.org/vlc-debian-llvm-uwp:20211020111246
    VLC_WIN_LLVM_UCRT_IMAGE: registry.videolan.org/vlc-debian-llvm-ucrt:20260331112916
    VLC_DEBIAN_IMAGE: registry.videolan.org/vlc-debian-unstable:20260611225331
    # Exact 3.0.x revision from the last green x64/x86/ARM UWP pipeline.
    UWP_VLC_REVISION: "f971556a3ef052908aad990818f4243f5b6ecafc"
    UWP_LIBVLC_BUILD_FLAGS: -z -r -u -w

.variables-win32: &variables-win32
        SHORTARCH: win32
        HOST_ARCH: i686
        TRIPLET: $HOST_ARCH-w64-mingw32

.variables-win64: &variables-win64
        SHORTARCH: win64
        HOST_ARCH: x86_64
        TRIPLET: $HOST_ARCH-w64-mingw32

.variables-win-arm: &variables-win-arm
        SHORTARCH: winarm
        HOST_ARCH: armv7
        TRIPLET: $HOST_ARCH-w64-mingw32

# Common rules for jobs using docker
.docker-template:
    tags:
        - docker
        - amd64

#
# Windows
#
.winrt-common:
    extends: .docker-template
    script: |
        git clone --branch 3.0.x --single-branch https://code.videolan.org/videolan/vlc vlc && cd vlc
        git checkout --detach "$UWP_VLC_REVISION"
        git config --global user.email "cone@example.com"
        git config --local user.name "Cony Cone"
        git am -3 ../patches/*.patch
        if [ $? -ne 0 ]; then
            git am --abort
            echo "Applying the patches failed, aborting git-am"
            exit 1
        fi
        extras/package/win32/build.sh -c -a $HOST_ARCH $UWP_LIBVLC_BUILD_FLAGS

.nightly-winrt-common:
    extends: .winrt-common
    artifacts:
        paths:
            - vlc/$SHORTARCH-uwp/*.7z
uwp-x64:
    extends: .nightly-winrt-common
    image:
        name: $VLC_UWP_LLVM_IMAGE
    variables:
        <<: *variables-win64

uwp-x86:
    extends: .nightly-winrt-common
    image:
        name: $VLC_UWP_LLVM_IMAGE
    variables:
        <<: *variables-win32

uwp-arm:
    extends: .nightly-winrt-common
    image:
        name: $VLC_WIN_LLVM_UCRT_IMAGE
    variables:
        <<: *variables-win-arm

#
# macOS
#
macos-nuget:
    extends: .docker-template
    image:
        name: $VLC_DEBIAN_IMAGE
    variables:
        MACOS_VLC_VERSION: "3.0.24"
        DOTNET_SDK_VERSION: "10.0.102"
    script: |
        curl -Lsfo dotnet-sdk.tar.gz https://builds.dotnet.microsoft.com/dotnet/Sdk/${DOTNET_SDK_VERSION}/dotnet-sdk-${DOTNET_SDK_VERSION}-linux-x64.tar.gz
        mkdir -p $HOME/dotnet && tar zxf dotnet-sdk.tar.gz -C $HOME/dotnet
        export DOTNET_ROOT=$HOME/dotnet PATH=$PATH:$HOME/dotnet
        ./package-nuget-mac.sh "$MACOS_VLC_VERSION"
    artifacts:
        paths:
            - VideoLAN.LibVLC.Mac.*.nupkg
